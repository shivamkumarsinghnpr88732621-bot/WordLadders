<!doctype html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>WordLadder — Padho, Samjho, Yaad Rakho</title>
<meta name="description" content="Book padhte waqt atka hua word type karo, AI turant Hinglish mein samjhayega — meaning, examples, sab kuch." />
<meta name="theme-color" content="#2b2418" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,500;1,8..60,700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css" />
</head>
<body>

<div class="page">

  <header class="topbar">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M3 5.5C3 5.5 5.5 4 8.5 4C11 4 12 5 12 5V19C12 19 11 18 8.5 18C5.5 18 3 19.5 3 19.5V5.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M21 5.5C21 5.5 18.5 4 15.5 4C13 4 12 5 12 5V19C12 19 13 18 15.5 18C18.5 18 21 19.5 21 19.5V5.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
      </span>
      <div class="brand__text">
        <h1>WordLadder</h1>
        <p>Padho, Samjho, Yaad Rakho</p>
      </div>
    </div>
    <div class="topbar__actions">
      <button class="icon-btn" id="historyBtn" aria-label="Recent words" title="Recent words">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.5"/><path d="M12 7.5V12L15 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="2.6" stroke="currentColor" stroke-width="1.5"/><path d="M12 3.5v2M12 18.5v2M20.5 12h-2M5.5 12h-2M17.7 6.3l-1.4 1.4M7.7 16.3l-1.4 1.4M17.7 17.7l-1.4-1.4M7.7 7.7L6.3 6.3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <main>
    <form class="search-card" id="searchForm">
      <div class="search-row">
        <div class="search-input">
          <svg viewBox="0 0 24 24" fill="none" class="search-input__icon"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.6"/><path d="M20 20L16.5 16.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <input id="wordInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Word type karo... e.g. wistful" />
        </div>
        <button type="submit" class="samjhao-btn" id="samjhaoBtn">
          <svg viewBox="0 0 24 24" fill="none" class="sparkle"><path d="M12 3l1.6 5.4L19 10l-5.4 1.6L12 17l-1.6-5.4L5 10l5.4-1.6L12 3z" fill="currentColor"/></svg>
          <span>Samjhao</span>
        </button>
      </div>
      <p class="search-hint">Book padhte waqt jo bhi word atke, wahi yahan daal do.</p>
    </form>

    <div id="resultArea" aria-live="polite"></div>
  </main>

  <footer class="page-footer">
    <p>Powered by aapka apna dimaag + thodi si AI ki madad</p>
  </footer>
</div>

<template id="tpl-loading">
  <div class="state-card loading-card">
    <div class="loader" aria-hidden="true"></div>
    <p>Samajh raha hoon<span class="dots"><span>.</span><span>.</span><span>.</span></span></p>
  </div>
</template>
